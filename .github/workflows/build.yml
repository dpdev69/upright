name: Build

# Hardening note: every `uses:` is pinned to a full commit SHA (the release tag is
# kept as a trailing comment). Let Dependabot bump them.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege by default; the release job below opts in to contents: write.
permissions:
  contents: read

jobs:
  core-tests:
    name: UprightKit tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: UprightKit/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('UprightKit/Package.swift', 'UprightKit/Package.resolved', 'UprightKit/Sources/**', 'UprightKit/Tests/**') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.0"

      - run: swift test --package-path UprightKit

  app:
    name: Build app and DMG
    runs-on: macos-15
    outputs:
      dmg-name: ${{ steps.meta.outputs.dmg_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode_16.2.app
          xcodebuild -version
          swift --version

      - name: Resolve version and DMG name
        id: meta
        run: |
          version="$(grep -m1 'MARKETING_VERSION' Upright.xcodeproj/project.pbxproj | sed -E 's/.*= *"?([^";]+)"?;.*/\1/')"
          if [[ -z "$version" ]]; then
            echo "::error::Could not read MARKETING_VERSION from project.pbxproj"
            exit 1
          fi
          echo "MARKETING_VERSION=$version"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $version in project.pbxproj"
              exit 1
            fi
            dmg_name="Upright-${version}.dmg"
          else
            dmg_name="Upright-${GITHUB_SHA::7}.dmg"
          fi
          echo "dmg_name=$dmg_name" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: UprightKit/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('UprightKit/Package.swift', 'UprightKit/Package.resolved', 'UprightKit/Sources/**', 'UprightKit/Tests/**') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Test UprightKit (macOS, includes IOKit layer and probe)
        run: swift test --package-path UprightKit

      - name: Build Upright.app
        run: make app

      - name: Verify app signature
        run: make verify

      # Signing/notarization secrets are deliberately NOT job-level env, so they are
      # never exposed to repo code (swift test / make app). Each one is scoped to the
      # step that needs it. secrets.* can't be used in a step `if:`, so this step only
      # records which secrets are set (true/false, never their values) and the steps
      # below are gated on its outputs. With no signing secrets (forks, or before the
      # Developer ID certificate exists) none of those steps run and the DMG is ad-hoc
      # signed, exactly as before. See docs/dev/RELEASING.md.
      - name: Detect signing secrets
        id: secrets
        env:
          HAS_P12: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
          HAS_P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
          HAS_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID != '' }}
          HAS_NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID != '' }}
          HAS_NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD != '' }}
        run: |
          # "all", "none" or "some" of the given true/false flags.
          group() {
            local set=0 total=0 flag
            for flag in "$@"; do
              total=$((total + 1))
              if [[ "$flag" == "true" ]]; then set=$((set + 1)); fi
            done
            if (( set == total )); then echo all; elif (( set == 0 )); then echo none; else echo some; fi
          }
          cert="$(group "$HAS_P12" "$HAS_P12_PASSWORD")"
          api="$(group "$HAS_NOTARY_KEY_ID" "$HAS_NOTARY_ISSUER_ID" "$HAS_NOTARY_KEY_P8")"
          appleid="$(group "$HAS_APPLE_ID" "$HAS_APPLE_TEAM_ID" "$HAS_APPLE_APP_PASSWORD")"

          if [[ "$cert" == "some" ]]; then
            echo "::error::Set both MACOS_CERTIFICATE_P12 and MACOS_CERTIFICATE_PASSWORD, or neither."
            exit 1
          fi
          if [[ "$api" == "some" ]]; then
            echo "::error::Set all of NOTARY_KEY_ID, NOTARY_ISSUER_ID and NOTARY_KEY_P8, or none."
            exit 1
          fi
          if [[ "$appleid" == "some" ]]; then
            echo "::error::Set all of APPLE_ID, APPLE_TEAM_ID and APPLE_APP_PASSWORD, or none."
            exit 1
          fi

          signing=false
          notarize=none
          if [[ "$cert" == "all" ]]; then
            signing=true
            # The App Store Connect API key wins when both notary credentials are set.
            if [[ "$api" == "all" ]]; then
              notarize=api
            elif [[ "$appleid" == "all" ]]; then
              notarize=appleid
            else
              echo "::warning::Signing with Developer ID but no notary credentials are set; the DMG will not be notarized."
            fi
          elif [[ "$api" == "all" || "$appleid" == "all" ]]; then
            echo "::warning::Notary credentials are set but the signing certificate is not; building an ad-hoc DMG."
          fi
          echo "signing=$signing" >> "$GITHUB_OUTPUT"
          echo "notarize=$notarize" >> "$GITHUB_OUTPUT"
          echo "signing=$signing notarize=$notarize"

      - name: Import signing certificate
        id: cert
        if: steps.secrets.outputs.signing == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/upright-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # Sign with the certificate's SHA-1 so no other identity on the runner can be picked.
          identity="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk '/"Developer ID Application: / { print $2; exit }')"
          if [[ -z "$identity" ]]; then
            echo "::error::MACOS_CERTIFICATE_P12 holds no valid Developer ID Application identity."
            exit 1
          fi
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "Imported signing identity $identity"

      # Upright has no entitlements: it isn't sandboxed and needs no hardened-runtime
      # exceptions (Accessibility and Input Monitoring are TCC grants, not entitlements),
      # so the app is signed without --entitlements, as the ad-hoc build is.
      - name: Sign app (Developer ID, hardened runtime)
        if: steps.secrets.outputs.signing == 'true'
        env:
          KEYCHAIN: ${{ steps.cert.outputs.keychain }}
          IDENTITY: ${{ steps.cert.outputs.identity }}
        run: |
          APP=build/Build/Products/Release/Upright.app
          codesign --force --options runtime --timestamp \
            --keychain "$KEYCHAIN" --sign "$IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          details="$(codesign -dvv "$APP" 2>&1)"
          echo "$details" | grep -E '^(Identifier|Authority|TeamIdentifier|Timestamp|CodeDirectory)' || true
          if ! echo "$details" | grep -Eq 'flags=.*runtime'; then
            echo "::error::Upright.app is not signed with the hardened runtime."
            exit 1
          fi

      - name: Package DMG
        env:
          DMG_NAME: ${{ steps.meta.outputs.dmg_name }}
        run: |
          scripts/make_dmg.sh build/Build/Products/Release/Upright.app "dist/${DMG_NAME}"

      - name: Sign DMG
        if: steps.secrets.outputs.signing == 'true'
        env:
          DMG_NAME: ${{ steps.meta.outputs.dmg_name }}
          KEYCHAIN: ${{ steps.cert.outputs.keychain }}
          IDENTITY: ${{ steps.cert.outputs.identity }}
        run: |
          codesign --force --timestamp --keychain "$KEYCHAIN" --sign "$IDENTITY" "dist/${DMG_NAME}"
          codesign --verify --strict --verbose=2 "dist/${DMG_NAME}"

      - name: Notarize and staple DMG
        if: steps.secrets.outputs.notarize == 'api' || steps.secrets.outputs.notarize == 'appleid'
        env:
          DMG_NAME: ${{ steps.meta.outputs.dmg_name }}
          NOTARIZE: ${{ steps.secrets.outputs.notarize }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          DMG="dist/${DMG_NAME}"
          if [[ "$NOTARIZE" == "api" ]]; then
            KEY="$RUNNER_TEMP/AuthKey_notary.p8"
            # Accept the .p8 file's text as is, or base64 of it.
            if [[ "$NOTARY_KEY_P8" == *"BEGIN PRIVATE KEY"* ]]; then
              printf '%s\n' "$NOTARY_KEY_P8" > "$KEY"
            else
              printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$KEY"
            fi
            chmod 600 "$KEY"
            auth=(--key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID")
          else
            auth=(--apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD")
          fi

          RESULT="$RUNNER_TEMP/notary-result.json"
          xcrun notarytool submit "$DMG" "${auth[@]}" --wait --timeout 30m \
            --output-format json > "$RESULT" || true
          status="$(plutil -extract status raw -o - "$RESULT" 2>/dev/null || echo unknown)"
          submission="$(plutil -extract id raw -o - "$RESULT" 2>/dev/null || true)"
          echo "Notarization ${submission:-(no id)}: $status"
          if [[ "$status" != "Accepted" ]]; then
            cat "$RESULT" || true
            if [[ -n "$submission" ]]; then
              xcrun notarytool log "$submission" "${auth[@]}" || true
            fi
            echo "::error::Notarization did not succeed (status: $status)."
            exit 1
          fi

          xcrun stapler staple "$DMG"

      - name: Check notarized DMG
        if: steps.secrets.outputs.notarize == 'api' || steps.secrets.outputs.notarize == 'appleid'
        env:
          DMG_NAME: ${{ steps.meta.outputs.dmg_name }}
        run: |
          DMG="dist/${DMG_NAME}"
          xcrun stapler validate "$DMG"
          spctl -a -vv -t open --context context:primary-signature "$DMG"
          MOUNT="$(mktemp -d)"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT" -quiet
          trap 'hdiutil detach "$MOUNT" -quiet || hdiutil detach "$MOUNT" -force -quiet || true' EXIT
          codesign --verify --deep --strict --verbose=2 "$MOUNT/Upright.app"
          spctl -a -vv -t exec "$MOUNT/Upright.app"

      - name: Remove signing keychain and notary key
        if: always() && steps.secrets.outputs.signing == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/upright-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/AuthKey_notary.p8" "$RUNNER_TEMP/notary-result.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Upright-dmg
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core-tests, app]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Upright-dmg
          path: dist

      - name: Attach DMG to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*.dmg
          generate_release_notes: true
