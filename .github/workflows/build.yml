name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-tests:
    name: UprightKit tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - run: swift test --package-path UprightKit

  app:
    name: Build app and unsigned DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test UprightKit (macOS, includes IOKit layer and probe)
        run: swift test --package-path UprightKit

      - name: Build Upright.app
        run: make app

      - name: Package DMG
        run: |
          scripts/make_dmg.sh build/Build/Products/Release/Upright.app "dist/Upright-${GITHUB_REF_NAME//\//-}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: Upright-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Attach DMG to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
