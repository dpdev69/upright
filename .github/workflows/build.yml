name: Build

# Hardening note: every `uses:` is pinned to a full commit SHA (the release tag is
# kept as a trailing comment). Let Dependabot bump them.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege by default; the release job below opts in to contents: write.
permissions:
  contents: read

jobs:
  core-tests:
    name: UprightKit tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: UprightKit/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('UprightKit/Package.swift', 'UprightKit/Package.resolved', 'UprightKit/Sources/**', 'UprightKit/Tests/**') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.0"

      - run: swift test --package-path UprightKit

  app:
    name: Build app and DMG
    runs-on: macos-15
    outputs:
      dmg-name: ${{ steps.meta.outputs.dmg_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode_16.2.app
          xcodebuild -version
          swift --version

      - name: Resolve version and DMG name
        id: meta
        run: |
          version="$(grep -m1 'MARKETING_VERSION' Upright.xcodeproj/project.pbxproj | sed -E 's/.*= *"?([^";]+)"?;.*/\1/')"
          if [[ -z "$version" ]]; then
            echo "::error::Could not read MARKETING_VERSION from project.pbxproj"
            exit 1
          fi
          echo "MARKETING_VERSION=$version"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $version in project.pbxproj"
              exit 1
            fi
            dmg_name="Upright-${version}.dmg"
          else
            dmg_name="Upright-${GITHUB_SHA::7}.dmg"
          fi
          echo "dmg_name=$dmg_name" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: UprightKit/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('UprightKit/Package.swift', 'UprightKit/Package.resolved', 'UprightKit/Sources/**', 'UprightKit/Tests/**') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Test UprightKit (macOS, includes IOKit layer and probe)
        run: swift test --package-path UprightKit

      - name: Build Upright.app
        run: make app

      - name: Verify app signature
        run: make verify

      # Signing/notarization secrets are deliberately NOT job-level env, so they are
      # never exposed to repo code (swift test / make app). They are scoped to the
      # individual steps below. This step only records which secrets are configured
      # (secrets.* cannot be used in step `if:`); when none are, an unsigned
      # (ad-hoc) DMG is built.
      - name: Detect signing secrets
        id: secrets
        env:
          HAS_P12: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
          HAS_P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD != '' }}
        run: |
          signing=false
          notarize=false
          if [[ "$HAS_P12" == "true" ]]; then
            signing=true
            if [[ "$HAS_APPLE_ID" == "true" && "$HAS_APPLE_TEAM_ID" == "true" && "$HAS_APPLE_APP_PASSWORD" == "true" ]]; then
              notarize=true
            fi
          fi
          echo "signing=$signing" >> "$GITHUB_OUTPUT"
          echo "notarize=$notarize" >> "$GITHUB_OUTPUT"
          echo "signing=$signing notarize=$notarize"

      - name: Import signing certificate
        if: steps.secrets.outputs.signing == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/upright-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Sign app (Developer ID, hardened runtime)
        if: steps.secrets.outputs.signing == 'true'
        run: |
          codesign --force --deep --options runtime --timestamp \
            --sign "Developer ID Application" \
            build/Build/Products/Release/Upright.app
          codesign --verify --deep --strict --verbose=2 build/Build/Products/Release/Upright.app

      - name: Package DMG
        env:
          DMG_NAME: ${{ steps.meta.outputs.dmg_name }}
        run: |
          scripts/make_dmg.sh build/Build/Products/Release/Upright.app "dist/${DMG_NAME}"

      - name: Sign DMG
        if: steps.secrets.outputs.signing == 'true'
        env:
          DMG_NAME: ${{ steps.meta.outputs.dmg_name }}
        run: |
          codesign --force --timestamp --sign "Developer ID Application" "dist/${DMG_NAME}"

      - name: Notarize and staple DMG
        if: steps.secrets.outputs.notarize == 'true'
        env:
          DMG_NAME: ${{ steps.meta.outputs.dmg_name }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit "dist/${DMG_NAME}" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "dist/${DMG_NAME}"
          xcrun stapler validate "dist/${DMG_NAME}"

      - name: Remove signing keychain
        if: always() && steps.secrets.outputs.signing == 'true'
        run: security delete-keychain "$RUNNER_TEMP/upright-signing.keychain-db" || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Upright-dmg
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core-tests, app]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Upright-dmg
          path: dist

      - name: Attach DMG to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*.dmg
          generate_release_notes: true
